name: CD

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-backend:
    name: Publish backend image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/documind-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-frontend:
    name: Trigger Cloudflare production build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require Cloudflare deploy hook
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$CLOUDFLARE_DEPLOY_HOOK_URL" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK_URL is not configured in the production environment." >&2
            exit 1
          fi

      - name: Trigger Cloudflare Workers Build
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --request POST "$CLOUDFLARE_DEPLOY_HOOK_URL")"
          echo "$response" | jq -e '.success == true and (.result.build_uuid | length > 0)'
          build_uuid="$(echo "$response" | jq -r '.result.build_uuid')"
          status="$(echo "$response" | jq -r '.result.status')"
          echo "Cloudflare build queued: $build_uuid ($status)"
          echo "### Cloudflare deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Build \`$build_uuid\` was accepted with status \`$status\`." >> "$GITHUB_STEP_SUMMARY"
