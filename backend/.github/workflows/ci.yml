name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Backend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma Schema
        run: npm run prisma:validate

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Build NestJS App
        run: npm run build
        env:
          CI: true

      - name: Build Production Docker Image
        run: docker build --tag ai-study-hub-backend:ci .

      - name: Verify Prisma CLI In Production Image
        run: docker run --rm ai-study-hub-backend:ci npx prisma --version

      - name: Smoke Test Production Container
        run: |
          docker run --rm \
            --entrypoint node \
            ai-study-hub-backend:ci \
            -e "console.log(require.resolve('./dist/main.js'))"
